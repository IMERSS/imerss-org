# Configuration
baseURL: "https://imerss.org/"
title: IMERSS
author: 
  name: "Joanne Whitehead"
  email: "joannew@gmx.com"

theme: "hextra"

contentDir: content

relativeUrls: true
publishDir: docs

enableRobotsTXT: true
enableGitInfo: true
# enableEmoji: false
hasCJKLanguage: false

# services:
#   googleAnalytics:
#     ID: G-MEASUREMENT_ID

outputs:
  home: [HTML]
  page: [HTML]
  section: [HTML, RSS]

defaultContentLanguage: en
languages:
  en:
    languageName: English
    weight: 1
    title: IMERSS

module:
  hugoVersion:
    extended: true
    min: "0.112.0"

  workspace: hugo.work

markup:
  defaultMarkdownHandler: goldmark
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
        enable: true

enableInlineShortcodes: true

menu:
  main:
    - identifier: home
      name: Home
      pageRef: /
      weight: 1
    - identifier: aboutus
      name: "About Us"
      pageRef: /about
      weight: 2
    - identifier: team
      name: "Our Team"
      pageRef: /team
      parent: aboutus
      weight: 1
    - identifier: work
      name: "Our Work"
      pageRef: /work
      weight: 3
    - identifier: contributions
      name: "Contributions"
      pageRef: /contributions
      parent: work
      weight: 1
    - identifier: media
      name: "Media"
      pageRef: /media
      parent: work
      weight: 2
    - identifier: involved
      name: "Get Involved"
      pageRef: /involved
      weight: 4
    - identifier: donate
      name: Donate
      #url: https://www.paypal.com/cgi-bin/webscr?cmd=_s-xclick&hosted_button_id=EHJFF84LNXFES
      pageRef: /donate
      weight: 5
    - name: Search
      weight: 6
      params:
        type: search

params:
  hextra:
    css:
      - css/custom.css

  description: Modern, responsive, batteries-included Hugo theme for creating beautiful static websites.

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      width: 35
      height: 30
    width: wide

  toc: false

  page:
    # full (100%), wide (90rem), normal (1280px)
    width: normal

  theme:
    # light | dark | system
    default: system
    displayToggle: true

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: true
    width: normal

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  # Search
  # flexsearch is enabled by default
  search:
    enable: true
    type: flexsearch

    flexsearch:
      # index page by: content | summary | heading | title
      index: content
      # full | forward | reverse | strict
      # https://github.com/nextapps-de/flexsearch/#tokenizer-prefix-search
      tokenize: forward

  editURL:
    enable: true
    base: "https://github.com/imfing/hextra/edit/main/exampleSite/content"

  blog:
    list:
      displayTags: true
      # date | lastmod | publishDate | title | weight
      sortBy: date
      sortOrder: desc # or "asc"

  highlight:
    copy:
      enable: true
      # hover | always
      display: hover

  comments:
    enable: false
    type: giscus

    # https://giscus.app/
    giscus:
      repo: imfing/hextra
      repoId: R_kgDOJ9fJag
      category: General
      categoryId: DIC_kwDOJ9fJas4CY7gW
      # mapping: pathname
      # strict: 0
      # reactionsEnabled: 1
      # emitMetadata: 0
      # inputPosition: top
      # lang: en
      # theme: noborder_dark
